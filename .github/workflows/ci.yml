name: .NET CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore DsacReporting.Api.csproj

    - name: Build
      run: dotnet build DsacReporting.Api.csproj --configuration Release --no-restore

    - name: Run tests
      run: |
        if [ -d "test" ]; then dotnet test test/DsacReporting.Api.Tests/DsacReporting.Api.Tests.csproj; else echo "No tests"; fi

  # Deploys are handled by Railway's GitHub integration (auto-deploy on push to main),
  # so no separate deploy job is needed here.
